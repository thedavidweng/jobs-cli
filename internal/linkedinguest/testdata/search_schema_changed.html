<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign In | LinkedIn</title>
    <meta name="pageKey" content="d_checkpoint_lg_consumer_login">
  </head>
  <body class="artdeco">
    <div class="sign-in-card">
      <h1 class="header__content__heading">Sign in</h1>
      <p class="header__content__subheading">Stay updated on your professional world</p>
      <form class="login__form" action="/uas/login-submit" method="post">
        <input id="username" name="session_key" type="email">
        <input id="password" name="session_password" type="password">
        <button type="submit" class="btn__primary--large">Sign in</button>
      </form>
    </div>
  </body>
</html>
