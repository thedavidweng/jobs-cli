version: 2
project_name: jobs-cli

before:
  hooks:
    - go mod tidy

builds:
  - &native
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/jobs-cli
    binary: jobs-cli
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X {{.ModulePath}}/internal/version.Version={{.Version}}
      - -X {{.ModulePath}}/internal/version.Commit={{.Commit}}
      - -X {{.ModulePath}}/internal/version.Date={{.Date}}
      - -X {{.ModulePath}}/internal/version.BuiltBy=goreleaser
  - <<: *native
    id: darwin-native
    goos: [darwin]
    hooks:
      post: bash build/darwin/sign-and-notarize.sh "{{ .Path }}" "{{ .IsSnapshot }}" darwin
  # Cask generation only accepts replacing Universal binaries. Replace separate
  # Darwin inputs so the native downloads remain available.
  - <<: *native
    id: universal-slices
    goos: [darwin]

universal_binaries:
  - id: jobs-cli-universal
    ids: [universal-slices]
    replace: true
    hooks:
      post: bash build/darwin/sign-and-notarize.sh "{{ .Path }}" "{{ .IsSnapshot }}" darwin

archives:
  - &native_archive
    id: native
    ids: [jobs-cli]
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64"}}x86_64
      {{- else if eq .Arch "all"}}universal
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  - <<: *native_archive
    id: darwin-native
    ids: [darwin-native]
  - id: universal
    ids: [jobs-cli-universal]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_darwin_universal"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: thedavidweng
    name: jobs-cli
  mode: append
  draft: false
  prerelease: auto
