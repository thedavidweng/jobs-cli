name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example v0.1.0
        required: false
        type: string
      acceptance_only:
        description: Sign and notarize snapshot archives without publishing a release or tap update
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: MOE AI LLC (NCFNX3LJ83)'
      APPLE_TEAM_ID: NCFNX3LJ83
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_SIGNING_ACCEPTANCE: ${{ inputs.acceptance_only == true }}
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run pre-release tests
        run: go test ./... -race
      - name: Verify Homebrew tap token
        if: inputs.acceptance_only != true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing HOMEBREW_TAP_GITHUB_TOKEN::Add a token with contents:write access to thedavidweng/homebrew-tap."
            exit 1
          fi
          can_push="$(gh api repos/thedavidweng/homebrew-tap --jq '.permissions.push' 2>/dev/null || echo false)"
          if [ "$can_push" != true ]; then
            echo "::error title=Invalid HOMEBREW_TAP_GITHUB_TOKEN::The token must have write access to thedavidweng/homebrew-tap."
            exit 1
          fi
      - name: Prepare Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?}" "${APPLE_CERTIFICATE_PASSWORD:?}"
          : "${APPLE_API_KEY_BASE64:?}" "${APPLE_API_KEY_ID:?}" "${APPLE_API_ISSUER:?}"
          umask 077
          keychain="$RUNNER_TEMP/jobs-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/jobs-signing.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/jobs-notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/jobs-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/jobs-notary.p8" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/jobs-signing.p12"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --parallelism 1 --timeout 75m ${{ inputs.acceptance_only == true && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ inputs.acceptance_only != true && secrets.GITHUB_TOKEN || '' }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ inputs.acceptance_only != true && secrets.HOMEBREW_TAP_GITHUB_TOKEN || 'unused-snapshot' }}
      - name: Verify signed archives
        run: shasum -a 256 -c checksums.txt
        working-directory: dist
      - name: Verify archived Darwin executables
        run: bash build/darwin/verify-archives.sh dist
      - name: Upload signed acceptance archives
        if: inputs.acceptance_only == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-acceptance
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/jobs-signing.p12" "$RUNNER_TEMP/jobs-notary.p8"
          if [[ -f "$RUNNER_TEMP/jobs-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/jobs-signing.keychain-db"
          fi

  signed-smoke:
    if: inputs.acceptance_only == true
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-acceptance
          path: snapshot
      - name: Verify notarized trust of archived executables
        run: bash build/darwin/verify-archives.sh snapshot
      - name: Execute native and Universal archives
        run: python3 build/package-smoke.py snapshot

  go-proxy:
    if: inputs.acceptance_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Refresh the Go module proxy
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          module_path="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          # proxy.golang.org caches its version list, so without this request
          # `go install ...@latest` can keep returning the previous release.
          curl -fsS --retry 3 "https://proxy.golang.org/${module_path}/@v/${TAG}.info"
