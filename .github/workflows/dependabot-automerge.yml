name: Dependabot auto-merge

on:
  pull_request_target:

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable auto-merge
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: true
      - name: Enable auto-merge for safe updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PKG_ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          set -euo pipefail
          deny='googleapis/release-please-action dependabot/fetch-metadata'
          for blocked in $deny; do
            case ",${DEP_NAMES}," in
              *",${blocked},"*)
                echo "skip auto-merge (denylist): $blocked"
                exit 0
                ;;
            esac
          done

          eligible=false
          reason=""
          if [ "$ALERT_STATE" = "OPEN" ] || [ "$ALERT_STATE" = "FIXED" ]; then
            eligible=true
            reason="security-update"
          fi
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            eligible=true
            reason="semver-patch"
          fi
          if [ "$PKG_ECOSYSTEM" = "github-actions" ] || [ "$PKG_ECOSYSTEM" = "github_actions" ]; then
            if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
              eligible=true
              reason="github-actions-non-major"
            fi
          fi
          if [ "$UPDATE_TYPE" = "version-update:semver-minor" ] && [ "$DEP_TYPE" != "direct:production" ]; then
            eligible=true
            reason="minor-non-production"
          fi

          if [ "$eligible" != true ]; then
            echo "skip auto-merge: ecosystem=$PKG_ECOSYSTEM update-type=$UPDATE_TYPE dependency-type=$DEP_TYPE alert=$ALERT_STATE names=$DEP_NAMES"
            exit 0
          fi
          echo "enable auto-merge ($reason)"
          gh pr merge --auto --squash "$PR_URL"
