name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Token, action pins and outputs live in the shared workflow; it mints a
    # thedavidweng-release GitHub App token, so release PRs and tags start
    # other workflows (PR checks, tag-push releases) like any other push.
    permissions: {}
    uses: thedavidweng/.github/.github/workflows/release-please.yml@907a093fd4fbde1ef2be3ef24d415d58560067b8 # v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release-notes:
    name: Release notes
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          module_path="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          install_notes="$(printf '%s\n' \
            '# Installation' \
            '' \
            '```shell' \
            '# macOS and Linux' \
            'curl -fsSL https://raw.githubusercontent.com/thedavidweng/jobs-cli/main/install.sh | sh' \
            '' \
            '# Windows' \
            'powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/thedavidweng/jobs-cli/main/install.ps1 | iex"' \
            '' \
            '# Homebrew (macOS and Linux)' \
            'brew install --cask thedavidweng/tap/jobs-cli' \
            '' \
            '# Go' \
            "go install ${module_path}/cmd/jobs-cli@latest" \
            '```')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_notes="$(gh release view "$TAG" --json body --jq .body)"
            case "$existing_notes" in
              *"# Installation"*)
                echo "installation notes already present; leaving release notes unchanged"
                exit 0
                ;;
            esac
            combined_notes="$(printf '%s\n\n%s\n' "$existing_notes" "$install_notes")"
            gh release edit "$TAG" --notes "$combined_notes"
          else
            gh release create "$TAG" --title "$TAG" --notes "$install_notes"
          fi
