name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Create GitHub Release
        if: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          set -euo pipefail
          module_path="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          install_notes="$(printf '%s\n' \
            '# Installation' \
            '' \
            '```shell' \
            '# macOS and Linux' \
            'curl -fsSL https://raw.githubusercontent.com/thedavidweng/jobs-cli/main/install.sh | sh' \
            '' \
            '# Windows' \
            'powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/thedavidweng/jobs-cli/main/install.ps1 | iex"' \
            '' \
            '# Homebrew (macOS and Linux)' \
            'brew install --cask thedavidweng/tap/jobs-cli' \
            '' \
            '# Go' \
            "go install ${module_path}/cmd/jobs-cli@latest" \
            '```')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_notes="$(gh release view "$TAG" --json body --jq .body)"
            case "$existing_notes" in
              *"# Installation"*)
                echo "installation notes already present; leaving release notes unchanged"
                exit 0
                ;;
            esac
            combined_notes="$(printf '%s\n\n%s\n' "$existing_notes" "$install_notes")"
            gh release edit "$TAG" --notes "$combined_notes"
          else
            gh release create "$TAG" --title "$TAG" --notes "$install_notes"
          fi
