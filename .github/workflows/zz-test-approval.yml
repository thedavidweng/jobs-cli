name: Test bot approval
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr review "${{ inputs.pr }}" --approve --body "test"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
