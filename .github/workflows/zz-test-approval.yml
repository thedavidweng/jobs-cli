name: Test bot approval
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr review "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --approve --body "automated probe approval"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
