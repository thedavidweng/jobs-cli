name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Enable real-browser application tests
        if: runner.os == 'Linux'
        run: |
          browser_path="$(command -v google-chrome)"
          echo "JOBS_TEST_BROWSER=$browser_path" >> "$GITHUB_ENV"
      - run: mise run check
      - run: git diff --exit-code

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the pinned workflow checker: no Go toolchain or app runtime in this job.
      - name: Install jactionlint
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: jactionlint

      - name: Problem matcher
        run: echo "::add-matcher::.github/jactionlint-matcher.json"

      - name: jactionlint
        run: |
          jactionlint -version
          jactionlint
