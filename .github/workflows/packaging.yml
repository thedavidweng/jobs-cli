name: Packaging

on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/packaging.yml"
      - "build/**"
      - "go.mod"
      - "go.sum"
      - "**.go"
  push:
    branches: [main]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/packaging.yml"
      - "build/**"
      - "go.mod"
      - "go.sum"
      - "**.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Sizes and archives
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare comparable configurations
        run: |
          mkdir -p dist
          ruby build/package-config.rb baseline dist/baseline.json
          ruby build/package-config.rb current dist/current.json
      - name: Install shared GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.15.4
          install-only: true
      - name: Baseline snapshot
        run: |
          goreleaser --version > dist/baseline-toolchain.txt
          goreleaser release --snapshot --clean --parallelism 2 --config dist/baseline.json
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: unused-snapshot
      - name: Current snapshot
        run: |
          goreleaser --version > dist/current-toolchain.txt
          goreleaser release --snapshot --clean --parallelism 2 --config dist/current.json
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: unused-snapshot
      - name: Verify checksums, cask selection and size comparison
        run: |
          python3 build/release_size.py dist/baseline dist/current dist/size-report.md
          cat dist/size-report.md >> "$GITHUB_STEP_SUMMARY"
          go version
      - name: Upload exact smoke-test archives and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: |
            dist/current/*.tar.gz
            dist/current/*.zip
            dist/current/checksums.txt
            dist/current/metadata.json
            dist/size-report.md
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Archive smoke (${{ matrix.os }})
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-snapshot
          path: snapshot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run checksummed native archive
        run: python build/package-smoke.py snapshot/current
