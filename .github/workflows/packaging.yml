name: Packaging

on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/packaging.yml"
      - "build/**"
      - "go.mod"
      - "go.sum"
      - "internal/version/**"
  push:
    branches: [main]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/packaging.yml"
      - "build/**"
      - "go.mod"
      - "go.sum"
      - "internal/version/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Sizes and archives
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare comparable configurations
        run: |
          mkdir -p dist
          ruby build/package-config.rb baseline dist/baseline.json
          ruby build/package-config.rb current dist/current.json
      - name: Baseline snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.15.4
          args: release --snapshot --clean --parallelism 3 --config dist/baseline.json
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: unused-snapshot
      - name: Current snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.15.4
          args: release --snapshot --clean --parallelism 3 --config dist/current.json
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: unused-snapshot
      - name: Verify checksums, cask selection and size comparison
        run: |
          python3 build/release_size.py dist/baseline dist/current dist/size-report.md
          cat dist/size-report.md >> "$GITHUB_STEP_SUMMARY"
          go version
      - name: Upload exact smoke-test archives and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-snapshot
          path: |
            dist/current/*.tar.gz
            dist/current/*.zip
            dist/current/checksums.txt
            dist/current/metadata.json
            dist/size-report.md
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Archive smoke (${{ matrix.os }})
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-snapshot
          path: snapshot
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Run checksummed native archive
        run: python build/package-smoke.py snapshot/current
