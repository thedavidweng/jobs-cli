[tools]
go = "1.27.3"
gofumpt = "0.12.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.lint]
run = "mise exec go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint@2.15.0 -- golangci-lint run"

[tasks.check]
run = ["mise run fmt", "mise run build ::: test ::: lint"]
